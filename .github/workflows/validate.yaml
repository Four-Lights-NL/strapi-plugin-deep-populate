name: Validate

on:
  workflow_call:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run verify

      - name: Prepare playground
        run: npm run playground:install

      - name: Typecheck
        run: npm run typecheck

      # Unit + integration with coverage. Uses a sourcemapped build so the v8
      # coverage can map the bundled plugin back to server/src.
      - name: Build (test)
        run: npm run build:test

      - name: Tests
        run: npm run test:coverage

      # Admin (React) components and pages are verified in jsdom, not through the
      # integration harness (which runs with `serveAdminPanel: false`).
      - name: Admin tests
        run: npm run test:admin

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

      - name: Biome CI
        run: npm run ci
