name: Pre-Release

on:
  workflow_call:
    inputs:
      bump_type:
        description: 'Bump type'
        required: false
        type: string
        default: 'patch'
      release_type:
        description: 'Prerelease'
        required: false
        type: string
        default: 'beta'
    secrets:
      RELEASE_APP_ID:
        description: 'App ID of the GitHub App allowed to bypass branch protection on main for releases'
        required: true
      RELEASE_APP_PRIVATE_KEY:
        description: 'Private key of the GitHub App allowed to bypass branch protection on main for releases'
        required: true
permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          cache-enabled: 'false'

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run verify

      - name: Config Git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Run release
        run: npm run release -- ${{ github.event.inputs.bump_type }} --ci --preRelease=${{ github.event.inputs.release_type }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
